<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Connect Your Live Dashboard — Agency OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0F1729;
    --navy:#131E33;
    --navy-card:#16223B;
    --gold:#C9A227;
    --gold-bright:#E8C25C;
    --success:#3ECF8E;
    --danger:#F4675B;
    --text:#EFEAD8;
    --text-dim:#9AA3B8;
    --border:rgba(201,162,39,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 20% -10%, #1B2A48 0%, var(--navy-deep) 55%);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .stage{
    width:100%;
    max-width:460px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    justify-content:center;
  }
  .brand .mark{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-family:'Cairo',sans-serif;font-weight:800;color:var(--navy-deep);font-size:15px;
  }
  .brand span{
    font-family:'Cairo',sans-serif;font-weight:700;letter-spacing:.04em;
    color:var(--text);font-size:14px;text-transform:uppercase;opacity:.85;
  }
  .card{
    background:var(--navy-card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:30px 26px 24px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    position:relative;
    overflow:hidden;
    min-height:430px;
    display:flex;
    flex-direction:column;
  }
  .card::before{
    content:"";
    position:absolute; top:-60px; right:-60px;
    width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,162,39,0.16),transparent 70%);
  }
  .eyebrow{
    font-family:'Cairo',sans-serif;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold-bright);
    font-weight:700;
    margin-bottom:10px;
  }
  h1{
    font-family:'Cairo',sans-serif;
    font-size:23px;
    line-height:1.28;
    margin:0 0 12px;
    color:#fff;
    font-weight:800;
  }
  p.desc{
    color:var(--text-dim);
    font-size:14.5px;
    line-height:1.6;
    margin:0 0 18px;
  }
  .visual{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:6px 0 14px;
    min-height:140px;
  }
  .tip{
    background:rgba(201,162,39,0.08);
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 13px;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.55;
  }
  .tip b{color:var(--gold-bright);}
  .security-note{
    background:rgba(62,207,142,0.08);
    border:1px solid rgba(62,207,142,0.3);
    border-radius:12px;
    padding:11px 13px;
    font-size:12.5px;
    color:#bfead6;
    line-height:1.55;
  }
  .dots{
    display:flex; gap:7px; justify-content:center; margin:20px 0 14px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,0.16);
    transition:all .25s ease;
  }
  .dot.active{ background:var(--gold-bright); width:20px; border-radius:5px; }
  .nav{
    display:flex; gap:10px;
  }
  button{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:14.5px;
    border-radius:12px;
    border:none;
    padding:13px 18px;
    cursor:pointer;
    flex:1;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{ transform:scale(0.97); }
  .btn-primary{
    background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    color:var(--navy-deep);
  }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    flex:0 0 84px;
  }
  .btn-ghost:disabled{ opacity:.35; cursor:default; }
  /* --- illustrations --- */
  .phone-frame{
    width:150px;height:130px;border-radius:14px;
    border:1.5px solid var(--border);
    background:linear-gradient(180deg,#182643,#111B30);
    display:flex; flex-direction:column; padding:12px; gap:8px;
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);
  }
  .bar{ height:9px;border-radius:5px;background:rgba(255,255,255,0.08); }
  .bar.w60{width:60%;} .bar.w80{width:80%;} .bar.w40{width:40%;}
  .fake-btn{
    margin-top:auto;
    background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    color:var(--navy-deep);
    font-family:'Cairo',sans-serif;font-weight:800;font-size:10px;
    border-radius:7px;padding:7px;text-align:center;
  }
  .key-icon{
    width:64px;height:64px;border-radius:16px;
    background:linear-gradient(135deg,rgba(201,162,39,0.22),rgba(201,162,39,0.06));
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
  }
  .notion-frame{
    width:170px;border-radius:14px;overflow:hidden;
    border:1.5px solid rgba(255,255,255,0.14);
    background:#fff;
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);
  }
  .notion-head{
    background:#F7F6F3;color:#37352F;font-size:9px;font-family:'Tajawal',sans-serif;
    padding:8px 10px;font-weight:700;border-bottom:1px solid #EDECE8;
  }
  .notion-body{ padding:12px 10px; }
  .notion-row{
    display:flex;align-items:center;gap:7px;
    padding:7px 8px;border-radius:7px;font-size:10px;color:#37352F;
    font-family:'Tajawal',sans-serif;
  }
  .notion-row.sel{ background:#EFF3FE; border:1px solid #C9DBFF; }
  .notion-check{
    width:13px;height:13px;border-radius:4px;border:1.5px solid #C9DBFF;
    background:#2E6BF0;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;
  }
  .notion-allow{
    margin:8px 10px 12px;
    background:#2E6BF0;color:#fff;font-size:10px;font-weight:700;
    text-align:center;padding:7px;border-radius:7px;font-family:'Tajawal',sans-serif;
  }
  .success-badge{
    display:flex;align-items:center;gap:9px;
    background:rgba(62,207,142,0.1);
    border:1px solid rgba(62,207,142,0.35);
    border-radius:12px;
    padding:11px 14px;
  }
  .success-dot{ width:9px;height:9px;border-radius:50%;background:var(--success);
    box-shadow:0 0 10px var(--success); }
  .success-badge span{ font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;color:#bfead6; }
</style>
</head>
<body>

<div class="stage">
  <div class="brand"><div class="mark">A</div><span>Agency OS</span></div>
  <div class="card" id="card">
    <!-- content injected by JS -->
  </div>
  <div class="dots" id="dots"></div>
  <div class="nav">
    <button class="btn-ghost" id="backBtn">Back</button>
    <button class="btn-primary" id="nextBtn">Next</button>
  </div>
</div>

<script>
const slides = [
  {
    eyebrow: "Step 1 of 4",
    title: "Open Settings on your dashboard",
    desc: "Go to your live dashboard and tap the <b>Settings</b> gear icon in the top bar.",
    visual: `
      <div class="phone-frame">
        <div class="bar w60"></div>
        <div class="bar w40"></div>
        <div class="bar w80"></div>
        <div class="fake-btn">⚙ SETTINGS</div>
      </div>`,
    tip: "💡 Tip: bookmark your dashboard's link — you'll come back to Settings anytime you need to reconnect or check your connection status."
  },
  {
    eyebrow: "Step 2 of 4",
    title: "Enter your License Key",
    desc: "Paste in the <b>License Key</b> you received at purchase. This is what links your dashboard to your account.",
    visual: `<div class="key-icon">🔑</div>`,
    tip: "💡 Lost your License Key? Reach out to us and we'll resend it — no need to redo anything else."
  },
  {
    eyebrow: "Step 3 of 4",
    title: "Tap \"Connect to Notion\"",
    desc: "You'll be taken straight to Notion's own official screen. Choose the <b>main workspace page</b> — not any of the databases below it — then tap <b>Allow access</b>.",
    visual: `
      <div class="notion-frame">
        <div class="notion-head">Give access to Agency OS</div>
        <div class="notion-body">
          <div class="notion-row sel"><div class="notion-check">✓</div> Agency OS — Workspace</div>
          <div class="notion-row" style="opacity:.4"><div class="notion-check" style="background:transparent;border-color:#D9D9D6"></div> Clients (database)</div>
          <div class="notion-row" style="opacity:.4"><div class="notion-check" style="background:transparent;border-color:#D9D9D6"></div> Finance (database)</div>
        </div>
        <div class="notion-allow">Allow access</div>
      </div>`,
    tip: "💡 You only ever share this one page — never the individual databases. Sharing it shares everything your dashboard needs, automatically."
  },
  {
    eyebrow: "Step 4 of 4 · Done",
    title: "Connected — live",
    desc: "You'll land right back on your dashboard. Your databases are found automatically — nothing to paste, nothing else to set up.",
    visual: `
      <div class="success-badge">
        <div class="success-dot"></div>
        <span>Connected — live</span>
      </div>`,
    tip: "🔒 Your License Key is locked to this Notion workspace, so it can't be shared around to open your live data elsewhere. Need to switch workspaces later? Use Disconnect in Settings first.",
    isLast: true
  }
];

let i = 0;
const card = document.getElementById('card');
const dotsEl = document.getElementById('dots');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');

function render(){
  const s = slides[i];
  card.innerHTML = `
    <div class="eyebrow">${s.eyebrow}</div>
    <h1>${s.title}</h1>
    <p class="desc">${s.desc}</p>
    <div class="visual">${s.visual}</div>
    <div class="${s.isLast ? 'security-note' : 'tip'}">${s.tip}</div>
  `;
  dotsEl.innerHTML = slides.map((_,idx) => `<div class="dot ${idx===i?'active':''}"></div>`).join('');
  backBtn.disabled = i === 0;
  nextBtn.textContent = i === slides.length - 1 ? "Got it →" : "Next";
}

backBtn.addEventListener('click', () => { if(i>0){ i--; render(); } });
nextBtn.addEventListener('click', () => {
  if(i < slides.length - 1){ i++; render(); }
  else { window.location.href = "https://agency-os-dashboard.moadab63.workers.dev"; }
});

render();
</script>
</body>
</html>
