<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Your Live Dashboard — Setup Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap');

  :root {
    --navy: #0F1729;
    --card: #161F38;
    --border: #23304F;
    --gold: #E8C25C;
    --gold-soft: rgba(232,194,92,0.14);
    --green: #4ADE80;
    --red: #F87171;
    --text: #E8ECF4;
    --muted: #8A93AC;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--navy);
    font-family: 'Tajawal', sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 28px 16px 40px;
  }

  /* ===== Top bar: edition switcher ===== */
  .controls {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .edition-toggle {
    display: flex;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    font-size: 12px;
    font-weight: 700;
  }
  .edition-toggle button {
    background: none;
    border: none;
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 12px;
  }
  .edition-toggle button.active {
    background: var(--gold-soft);
    color: var(--gold);
  }

  /* ===== Progress dots (legit — this IS a real 7-step sequence) ===== */
  .progress {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border);
    transition: all 0.25s ease;
  }
  .dot.active { background: var(--gold); width: 22px; border-radius: 4px; }
  .dot.done { background: var(--green); }

  /* ===== Device frame ===== */
  .frame-wrap {
    width: 100%;
    max-width: 900px;
    position: relative;
  }
  .device {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    min-height: 480px;
    position: relative;
  }
  .device-chrome {
    background: #0B1220;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  .device-chrome span { width: 9px; height: 9px; border-radius: 50%; background: #2B3654; }
  .device-url {
    flex: 1;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    background: #0F1729;
    border-radius: 6px;
    padding: 4px 10px;
    margin: 0 40px;
  }

  .screen { padding: 40px 44px; min-height: 420px; position: relative; }
  .step-eyebrow {
    font-family: 'Cairo', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .step-title {
    font-family: 'Cairo', sans-serif;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 18px;
    line-height: 1.3;
  }

  /* simulated UI mockup pieces */
  .mock-field { margin-bottom: 14px; }
  .mock-label { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .mock-input {
    background: #0F1729;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 13px;
    color: var(--text);
    position: relative;
  }
  .mock-input.token { letter-spacing: 3px; }
  .mock-btn {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-weight: 700;
    font-size: 13px;
    padding: 11px 20px;
    border-radius: 8px;
    margin-top: 8px;
    position: relative;
  }
  .mock-btn.outline {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .mock-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #0F1729; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; margin-bottom: 8px;
  }
  .mock-badge {
    font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  }
  .mock-badge.green { background: rgba(74,222,128,0.14); color: var(--green); border: 1px solid var(--green); }
  .mock-badge.gray { background: rgba(138,147,172,0.14); color: var(--muted); border: 1px solid var(--border); }

  /* fake cursor — the signature element: it "clicks" through the demo like a real recording */
  .cursor {
    position: absolute;
    width: 22px; height: 22px;
    pointer-events: none;
    transition: left 1.1s cubic-bezier(.65,0,.35,1), top 1.1s cubic-bezier(.65,0,.35,1);
    z-index: 5;
  }
  .cursor svg { filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
  .cursor.click svg circle { animation: click-pulse 0.4s ease; }
  @keyframes click-pulse {
    0% { r: 0; opacity: 0.8; }
    100% { r: 16; opacity: 0; }
  }

  /* explanation caption under each step */
  .narration {
    width: 100%; max-width: 900px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    border-radius: 12px;
    padding: 16px 20px;
    margin-top: 18px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }

  /* nav */
  .nav {
    width: 100%; max-width: 900px;
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 18px;
  }
  .nav-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 11px 22px; border-radius: 10px; font-weight: 700; font-size: 13px;
    cursor: pointer; font-family: 'Tajawal', sans-serif;
  }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn.primary {
    background: var(--gold); color: var(--navy); border-color: var(--gold);
  }
  .nav-btn.primary:hover { background: var(--gold); }
  .step-count { font-size: 12px; color: var(--muted); }

  .arrow-left, .arrow-right {
    display: inline-block; width: 7px; height: 7px;
    border-top: 2px solid currentColor; border-right: 2px solid currentColor;
  }
  .arrow-left { transform: rotate(-135deg); }
  .arrow-right { transform: rotate(45deg); }

  @media (max-width: 600px) {
    .screen { padding: 28px 22px; }
    .step-title { font-size: 21px; }
  }
</style>
</head>
<body>

  <div class="controls">
    <div class="edition-toggle">
      <button id="btnFreelancer" class="active" onclick="setEdition('freelancer')">Freelancer</button>
      <button id="btnAgency" onclick="setEdition('agency')">Agency</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>

  <div class="frame-wrap">
    <div class="device">
      <div class="device-chrome">
        <span></span><span></span><span></span>
        <div class="device-url" id="deviceUrl"></div>
      </div>
      <div class="screen" id="screen">
        <!-- injected -->
      </div>
      <div class="cursor" id="cursor" style="left:50%;top:50%;">
        <svg width="22" height="22" viewBox="0 0 22 22">
          <circle cx="4" cy="4" r="0" fill="#E8C25C" opacity="0"></circle>
          <path d="M2 1 L2 17 L6.5 13.5 L9 20 L11.5 19 L9 12.5 L15 12.5 Z" fill="#E8C25C" stroke="#0F1729" stroke-width="1"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="narration" id="narration">
    <div id="narrationText"></div>
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="prevStep()"><span class="arrow-left"></span> Back</button>
    <span class="step-count" id="stepCount"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="nextStep()"><span id="nextBtnLabel">Next</span> <span class="arrow-right" id="nextBtnArrow"></span></button>
  </div>

<script>
const STEPS_BASE = [
  {
    eyebrow: 'Welcome',
    url: 'notion.so',
    title: "Let's connect your live dashboard",
    narration: "Before using Agency OS day to day, there's one 5-minute setup: connecting your dashboard to your own Notion workspace. The 5 steps below walk through it.",
    body: () => `
      <div style="text-align:center;padding:50px 0;">
        <div style="font-size:52px;margin-bottom:14px;">🧭</div>
        <div style="font-family:'Cairo',sans-serif;font-size:20px;font-weight:800;color:var(--gold);">Agency OS</div>
        <div style="color:var(--muted);font-size:13px;margin-top:6px;">5 minutes · no coding required</div>
      </div>
    `
  },
  {
    eyebrow: 'Step 1 of 5',
    url: 'notion.so/my-integrations',
    title: 'Create a free integration',
    narration: "Go to notion.so/my-integrations. Tap '+ New integration', give it any name (e.g. 'My Dashboard'), and choose 'Access token' as the type. Then tap Submit.",
    body: () => `
      <div class="mock-field">
        <div class="mock-label">Integration name</div>
        <div class="mock-input">My Dashboard</div>
      </div>
      <div class="mock-field">
        <div class="mock-label">Type</div>
        <div class="mock-input">Access token</div>
      </div>
      <div class="mock-btn" id="targetEl">Submit</div>
    `
  },
  {
    eyebrow: 'Step 2 of 5',
    url: 'notion.so/my-integrations',
    title: 'Copy your token',
    narration: "On the integration page, tap 'Show' next to Internal Integration Secret, then Copy. This is like a password — keep it private, don't share it anywhere.",
    body: () => `
      <div class="mock-field">
        <div class="mock-label">Internal Integration Secret</div>
        <div class="mock-input token">•••••••••••••••••</div>
      </div>
      <div class="mock-btn outline" id="targetEl">👁 Show</div>
      <div class="mock-btn" style="margin-inline-start:8px;">Copy</div>
    `
  },
  {
    eyebrow: 'Step 3 of 5',
    url: (ed) => ed === 'agency' ? 'notion.so — Team database' : 'notion.so — Content Calendar',
    title: 'Share your databases',
    narration: (ed) => ed === 'agency'
      ? "Now, for each of the 6 databases — Clients, Finance, Projects, Tasks, Content Calendar, and Team — open it, tap the ••• menu, go to Connections, Connect to, and pick your integration. Don't skip Team — it's easy to miss."
      : "Now, for each of the 5 databases — Clients, Finance, Projects, Tasks, and Content Calendar — open it, tap the ••• menu, go to Connections, Connect to, and pick your integration.",
    body: (ed) => {
      const dbs = ed === 'agency'
        ? ['Clients','Finance','Projects','Tasks','Content Calendar','Team']
        : ['Clients','Finance','Projects','Tasks','Content Calendar'];
      return dbs.map((d,i) => `
        <div class="mock-row" ${i===dbs.length-1 ? 'id="targetEl"' : ''}>
          <span>${d}</span>
          <span class="mock-badge ${i < dbs.length-1 ? 'green' : 'gray'}">${i < dbs.length-1 ? 'Connections 1' : 'Connect to…'}</span>
        </div>
      `).join('');
    }
  },
  {
    eyebrow: 'Step 4 of 5',
    url: 'notion.so/p/1a2b3c4d5e6f...?v=...',
    title: 'Copy each Database ID',
    narration: "Open each database as a full page. In the URL, copy only the 32-character ID — not the whole link. The easiest way: tap ••• then Copy link, then just keep the part between /p/ and the question mark.",
    body: () => `
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Tap ••• then Copy link on the database. This is what you'll get:</div>
      <div style="background:#0F1729;border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:12px;line-height:1.9;overflow-wrap:break-word;">
        <span style="color:var(--muted);">notion.so/p/</span><span style="color:var(--gold);font-weight:700;">1a2b3c4d5e6f7g8h9i0j1a2b3c4d5e6f</span><span style="color:var(--muted);">?v=209e8f7a6b5c</span>
      </div>
      <div style="margin-top:12px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:12px 14px;">
        <div style="font-size:12px;color:var(--text);line-height:1.6;">
          <span style="color:var(--gold);font-weight:700;">Copy the part between</span>
          <code style="background:#0F1729;padding:2px 6px;border-radius:4px;color:var(--gold);">/p/</code>
          <span style="color:var(--gold);font-weight:700;">and</span>
          <code style="background:#0F1729;padding:2px 6px;border-radius:4px;color:var(--gold);">?v=</code>
          — that's your 32-character Database ID, shown in gold above.
        </div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:10px;">🚫 Not the "notion.so/p/" part, and not the "?v=..." part — just what's between them.</div>
    `
  },
  {
    eyebrow: 'Step 5 of 5',
    url: 'agency-os-dashboard.moadab63.workers.dev',
    title: 'Connect your dashboard',
    narration: (ed) => `Go to agency-os-dashboard.moadab63.workers.dev, tap Settings, and paste your License Key, your token, plus all database IDs${ed==='agency' ? ' — including Team' : ''}. Then tap Save and Connect.`,
    body: (ed) => {
      const dbs = ed === 'agency'
        ? ['Clients','Finance','Team (optional)','Projects','Tasks','Content Calendar']
        : ['Clients','Finance','Projects','Tasks','Content Calendar'];
      return `
        <div class="mock-field">
          <div class="mock-label">License Key</div>
          <div class="mock-input">AOS-XXXX-XXXX-XXXX</div>
        </div>
        ${dbs.map(d => `
          <div class="mock-field">
            <div class="mock-label">${d} database ID</div>
            <div class="mock-input">••••••••••••••••••••••••••••••</div>
          </div>
        `).join('')}
        <div class="mock-btn" id="targetEl">Save &amp; Connect</div>
      `;
    }
  },
  {
    eyebrow: 'Done',
    url: 'agency-os-dashboard.moadab63.workers.dev',
    title: "You're connected — live",
    narration: "That's it — you're connected. Your dashboard now pulls real numbers straight from your own Notion workspace, and updates automatically every time you edit something in Notion. No more setup needed.",
    body: () => `
      <div style="text-align:center;padding:40px 0;">
        <div class="mock-badge green" style="font-size:13px;padding:8px 18px;display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;"></span> Connected — live</div>
        <div style="color:var(--muted);font-size:13px;margin-top:18px;">Your dashboard now updates automatically as you edit Notion.</div>
      </div>
    `
  }
];

let edition = 'freelancer';
let current = 0;

function setEdition(ed) {
  edition = ed;
  document.getElementById('btnFreelancer').classList.toggle('active', ed === 'freelancer');
  document.getElementById('btnAgency').classList.toggle('active', ed === 'agency');
  render();
}

function resolveVal(v) { return typeof v === 'function' ? v(edition) : v; }

function renderProgress() {
  const wrap = document.getElementById('progress');
  wrap.innerHTML = STEPS_BASE.map((_, i) => {
    const cls = i === current ? 'active' : (i < current ? 'done' : '');
    return `<div class="dot ${cls}"></div>`;
  }).join('');
}

function render() {
  const step = STEPS_BASE[current];
  document.getElementById('deviceUrl').textContent = resolveVal(step.url);
  document.getElementById('screen').innerHTML = `
    <div class="step-eyebrow">${step.eyebrow}</div>
    <div class="step-title">${step.title}</div>
    ${resolveVal(step.body)}
  `;
  document.getElementById('narrationText').textContent = resolveVal(step.narration);
  document.getElementById('stepCount').textContent = `${current + 1} / ${STEPS_BASE.length}`;
  document.getElementById('prevBtn').disabled = current === 0;
  const isLast = current === STEPS_BASE.length - 1;
  document.getElementById('nextBtnLabel').textContent = isLast ? 'Restart' : 'Next';
  document.getElementById('nextBtnArrow').style.display = isLast ? 'none' : 'inline-block';

  renderProgress();

  const cursor = document.getElementById('cursor');
  const targetEl = document.getElementById('targetEl');
  if (targetEl) {
    // Position the cursor at the real element's location, computed from
    // actual layout — not a guessed percentage — so it stays correct no
    // matter how long the content is (e.g. 5 vs 6 databases).
    cursor.style.display = 'block';
    const deviceRect = document.querySelector('.device').getBoundingClientRect();
    const targetRect = targetEl.getBoundingClientRect();
    const left = targetRect.left - deviceRect.left + targetRect.width / 2 - 11;
    const top = targetRect.top - deviceRect.top + targetRect.height / 2 - 11;
    cursor.style.left = left + 'px';
    cursor.style.top = top + 'px';
    cursor.classList.remove('click');
    void cursor.offsetWidth;
    cursor.classList.add('click');
  } else {
    // No real tappable target on this step (Welcome, Step 4's read-only
    // explanation, Done) — hide the cursor instead of pointing at nothing.
    cursor.style.display = 'none';
  }
}

function nextStep() {
  if (current === STEPS_BASE.length - 1) { current = 0; } else { current++; }
  render();
}
function prevStep() {
  if (current > 0) { current--; render(); }
}

render();
</script>
</body>
</html>
