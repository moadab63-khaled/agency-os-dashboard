<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Email Alerts Setup Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F1729;
    --card:#16223B;
    --gold:#C9A227;
    --coral:#FF9F5A;
    --green:#34D399;
    --blue:#5AA9E6;
    --text:#EFEAD8;
    --muted:#9AA3B8;
    --border:rgba(201,162,39,0.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    margin:0;
    font-family:'Tajawal',sans-serif;
    background:var(--navy);
    color:var(--text);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-y:auto;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px 10px;
  }
  .brand{
    font-size:13px;
    letter-spacing:.08em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .brand b{color:var(--gold);font-weight:700;font-family:'Cairo',sans-serif;}
  .toggle{
    display:flex;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .toggle button{
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:12.5px;
    font-weight:600;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:.15s;
  }
  .toggle button.active{
    background:var(--gold);
    color:var(--navy);
  }
  .progress{
    display:flex;
    gap:5px;
    padding:0 18px 14px;
  }
  .progress .dot{
    flex:1;
    height:4px;
    border-radius:3px;
    background:var(--border);
    transition:.2s;
  }
  .progress .dot.done{background:var(--gold);}
  .stage{
    flex:1;
    position:relative;
    padding:8px 18px 24px;
  }
  .screen{
    display:none;
    animation:fade .25s ease;
    flex-direction:column;
  }
  .screen.active{display:flex;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .eyebrow{
    font-size:11.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--coral);
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    font-size:22px;
    margin:0 0 8px;
    line-height:1.25;
  }
  p.lead{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.5;
    margin:0 0 18px;
  }
  .mock{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
  }
  .mock-header{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
    margin-bottom:14px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
  }
  .mock-header .zdot{width:8px;height:8px;border-radius:50%;background:var(--coral);}
  .field{
    background:#0F1729;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    position:relative;
  }
  .field.target{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .field-label{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:5px;
  }
  .field-value{
    font-size:14px;
    font-weight:600;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .chip{
    display:inline-block;
    background:#1F2A45;
    color:var(--blue);
    border:1px solid #2E3C5E;
    border-radius:6px;
    padding:2px 8px;
    font-size:12px;
    font-weight:600;
    margin:2px 3px 2px 0;
  }
  .chevron{
    color:var(--muted);
    font-size:13px;
  }
  .btn-row{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .btn{
    flex:1;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .btn.primary{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--navy);
  }
  .btn.primary:hover,.btn.primary:active,.btn.primary:focus{
    color:var(--navy);
  }
  .btn.ghost{
    background:transparent;
  }
  .arrow{display:inline-block;}
  .pointer{
    position:absolute;
    width:26px;
    height:26px;
    pointer-events:none;
    z-index:50;
    transition:top .35s cubic-bezier(.4,0,.2,1), left .35s cubic-bezier(.4,0,.2,1), opacity .2s;
    opacity:0;
  }
  .pointer svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));}
  .note{
    background:rgba(212,175,106,.08);
    border:1px solid rgba(212,175,106,.35);
    border-radius:10px;
    padding:10px 12px;
    font-size:12.5px;
    color:var(--gold);
    margin-top:12px;
    line-height:1.5;
  }
  .badge-ok{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:rgba(52,211,153,.12);
    border:1px solid rgba(52,211,153,.4);
    color:var(--green);
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .stepper .cur{color:var(--gold);font-weight:700;}
  .done-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:12px;
  }
  .done-icon{
    width:64px;height:64px;border-radius:50%;
    background:rgba(52,211,153,.12);
    border:1px solid rgba(52,211,153,.4);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;color:var(--green);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Agency <b>OS</b> — Email Alerts</div>
  <div class="toggle">
    <button id="btnInvoice" class="active">Invoice Alert</button>
    <button id="btnHealth">Health Alert</button>
  </div>
</div>

<div class="progress" id="progress"></div>

<div class="stage" id="stage"></div>

<div class="pointer" id="pointer">
  <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
    <path d="M2 3L24 13L2 23L7 13Z" fill="#D4AF6A" stroke="#0B1220" stroke-width="1.2" stroke-linejoin="round"/>
  </svg>
</div>

<script>
const CONTENT = {
  invoice: {
    label: "Invoice Overdue Alert",
    database: "Finance",
    property: "Invoice Status",
    value: "Overdue",
    subjectChip: "{{Title}}",
    subject: "Invoice overdue",
    body: ["{{Title}} is now marked ", "{{Invoice Status}}", ". Open it here: ", "{{Url}}"]
  },
  health: {
    label: "Client Health Alert",
    database: "Clients",
    property: "Health Status",
    value: "At Risk",
    subjectChip: "{{Title}}",
    subject: "Client health changed",
    body: ["{{Title}} moved to ", "{{Health Status}}", ". Open it here: ", "{{Url}}"]
  }
};

// pick starting mode from ?mode=invoice|health in the URL so a link from a specific
// PDF/guide page opens directly on the right alert instead of always defaulting
const urlParams = new URLSearchParams(window.location.search);
let mode = (urlParams.get('mode') === 'health') ? 'health' : 'invoice';
let stepIndex = 0;

function C(){ return CONTENT[mode]; }

function screens(){
  const c = C();
  return [
    // 0 Welcome
    {
      target: null,
      render: () => `
        <div class="eyebrow">Setup Walkthrough</div>
        <h1>Set up your ${c.label}</h1>
        <p class="lead">Five short steps in your own free Zapier account. Takes about 5 minutes. Nothing is stored on our servers — it connects your own Notion and Gmail directly.</p>
        <div class="mock">
          <div class="mock-header"><span class="zdot"></span> zapier.com — your account</div>
          <div class="field"><div class="field-label">What this Zap does</div>
            <div class="field-value" style="display:block;font-weight:500;font-size:13.5px;color:var(--muted)">
              Watches your <b style="color:var(--text)">${c.database}</b> database in Notion. When <b style="color:var(--text)">${c.property}</b> changes to <b style="color:var(--text)">${c.value}</b>, it sends you an email automatically.
            </div>
          </div>
          <div class="note">Use the toggle at the top to switch between Invoice and Health — both Zaps are built the exact same way.</div>
        </div>
      `
    },
    // 1 Create Zap
    {
      target: "#createZapBtn",
      render: () => `
        <div class="stepper">Step <span class="cur">1</span> / 5 — Create the Zap</div>
        <h1>Start a new Zap</h1>
        <p class="lead">In Zapier, tap the orange "+ Create" button, then choose "Zaps".</p>
        <div class="mock">
          <div class="mock-header"><span class="zdot"></span> zapier.com</div>
          <div class="field target" id="createZapBtn">
            <div class="field-value"><span>+ Create Zap</span><span class="chevron">></span></div>
          </div>
          <div class="field"><div class="field-label">Name it (optional but helpful)</div>
            <div class="field-value">${c.label}</div>
          </div>
        </div>
      `
    },
    // 2 Trigger
    {
      target: "#triggerField",
      render: () => `
        <div class="stepper">Step <span class="cur">2</span> / 5 — Set the trigger</div>
        <h1>Connect Notion as the trigger</h1>
        <p class="lead">Search apps for "Notion", choose "Updated Database Item", connect your Notion account, then pick your <b>${c.database}</b> database.</p>
        <div class="mock">
          <div class="mock-header"><span class="zdot"></span> 1. Trigger</div>
          <div class="field"><div class="field-label">App</div><div class="field-value">Notion</div></div>
          <div class="field"><div class="field-label">Event</div><div class="field-value">Updated Database Item</div></div>
          <div class="field target" id="triggerField"><div class="field-label">Database</div>
            <div class="field-value"><span>${c.database}</span><span class="chevron">v</span></div>
          </div>
        </div>
      `
    },
    // 3 Filter
    {
      target: "#filterField",
      render: () => `
        <div class="stepper">Step <span class="cur">3</span> / 5 — Add a filter</div>
        <h1>Only fire for the right status</h1>
        <p class="lead">Add a "Filter by Zapier" step so the email only sends when <b>${c.property}</b> actually changes to <b>${c.value}</b> — not on every edit.</p>
        <div class="mock">
          <div class="mock-header"><span class="zdot"></span> 2. Filter</div>
          <div class="field"><div class="field-label">Only continue if...</div><div class="field-value">${c.property}</div></div>
          <div class="field"><div class="field-label">Condition</div><div class="field-value">(Text) Exactly matches</div></div>
          <div class="field target" id="filterField"><div class="field-label">Value</div>
            <div class="field-value"><span>${c.value}</span></div>
          </div>
        </div>
      `
    },
    // 4 Action
    {
      target: "#sendField",
      render: () => `
        <div class="stepper">Step <span class="cur">4</span> / 5 — Set the action</div>
        <h1>Connect Gmail to send the email</h1>
        <p class="lead">Choose Gmail "Send Email", connect your Gmail account, then fill in the subject and body using the chips Zapier pulls from Notion — don't type these by hand.</p>
        <div class="mock">
          <div class="mock-header"><span class="zdot"></span> 3. Action — Gmail</div>
          <div class="field"><div class="field-label">Subject</div>
            <div class="field-value"><span class="chip">${c.subjectChip}</span>${c.subject}</div>
          </div>
          <div class="field target" id="sendField"><div class="field-label">Body</div>
            <div class="field-value" style="display:block;font-weight:500;font-size:13.5px;">
              ${c.body[0]}<span class="chip">${c.body[1]}</span>${c.body[2]}<span class="chip">${c.body[3]}</span>
            </div>
          </div>
          <div class="note">On mobile, build the body line by line — text, then chip, then Enter. Typing a space right next to a chip can duplicate or break it.</div>
        </div>
      `
    },
    // 5 Test & Publish
    {
      target: "#publishBtn",
      render: () => `
        <div class="stepper">Step <span class="cur">5</span> / 5 — Test and publish</div>
        <h1>Send a real test, then publish</h1>
        <p class="lead">Tap "Test step" to send yourself one real email. If it looks right, publish the Zap so it keeps watching automatically — even when your dashboard is closed.</p>
        <div class="mock">
          <div class="mock-header"><span class="zdot"></span> Finish up</div>
          <div class="field"><div class="field-value"><span>Test step</span><span class="badge-ok">&#10003; Sent</span></div></div>
          <div class="field target" id="publishBtn"><div class="field-value"><span>Publish Zap</span><span class="chevron">></span></div></div>
        </div>
      `
    },
    // 6 Done
    {
      target: null,
      render: () => `
        <div class="done-wrap">
          <div class="done-icon">&#10003;</div>
          <h1 style="margin-bottom:4px;">${c.label} is live</h1>
          <p class="lead" style="margin-bottom:0;">Zapier is now watching your ${c.database} database in the background. You'll get an email the moment ${c.property} changes to ${c.value} — no need to keep the dashboard open.</p>
        </div>
      `
    }
  ];
}

function renderProgress(){
  const total = screens().length - 1; // exclude welcome from bar count basis, but keep simple: use all screens
  const el = document.getElementById('progress');
  const list = screens();
  el.innerHTML = list.map((_, i) => `<div class="dot ${i <= stepIndex ? 'done' : ''}"></div>`).join('');
}

function renderStage(){
  const list = screens();
  const s = list[stepIndex];
  const stage = document.getElementById('stage');
  const isFirst = stepIndex === 0;
  const isLast = stepIndex === list.length - 1;

  stage.innerHTML = `
    <div class="screen active">
      ${s.render()}
      <div class="btn-row">
        ${!isFirst ? `<button class="btn ghost" id="backBtn">Back</button>` : ``}
        ${!isLast ? `<button class="btn primary" id="nextBtn">${isFirst ? 'Start' : 'Next'}</button>` : `<button class="btn primary" id="restartBtn">Restart</button>`}
      </div>
    </div>
  `;

  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click', () => { stepIndex++; renderProgress(); renderStage(); });
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', () => { stepIndex--; renderProgress(); renderStage(); });
  const restartBtn = document.getElementById('restartBtn');
  if(restartBtn) restartBtn.addEventListener('click', () => { stepIndex = 0; renderProgress(); renderStage(); });

  renderProgress();
  positionPointer(s.target);
}

function positionPointer(selector){
  const p = document.getElementById('pointer');
  if(!selector){
    p.style.opacity = '0';
    return;
  }
  // wait a tick for layout
  requestAnimationFrame(() => {
    const el = document.querySelector(selector);
    if(!el){ p.style.opacity = '0'; return; }
    const r = el.getBoundingClientRect();
    // position the pointer just OUTSIDE the field's left edge so it never overlaps the field's own text
    const px = Math.max(6, r.left + window.scrollX - 30);
    const py = r.top + window.scrollY + r.height / 2 - 13;
    p.style.left = px + 'px';
    p.style.top = py + 'px';
    p.style.opacity = '1';
  });
}

document.getElementById('btnInvoice').addEventListener('click', () => setMode('invoice'));
document.getElementById('btnHealth').addEventListener('click', () => setMode('health'));

function setMode(m){
  mode = m;
  document.getElementById('btnInvoice').classList.toggle('active', m === 'invoice');
  document.getElementById('btnHealth').classList.toggle('active', m === 'health');
  renderStage();
}

window.addEventListener('resize', () => {
  const s = screens()[stepIndex];
  positionPointer(s.target);
});

// sync toggle button visuals to whatever mode we started on (default or from URL)
document.getElementById('btnInvoice').classList.toggle('active', mode === 'invoice');
document.getElementById('btnHealth').classList.toggle('active', mode === 'health');
renderStage();
</script>

</body>
</html>
